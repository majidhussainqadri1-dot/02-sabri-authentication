name: Temporary File 02 R332 Release Identity Apply

on:
  push:
    branches:
      - fix/file02-account-taxonomy-parity-1.2.4

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply only the frozen R332 release-identity ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          current_files = [
            'sabri-authentication.php','STATUS.md','STAGING-ACCEPTANCE.md','CONTRACTS.md','MIGRATION.md',
            'RELEASE-MANIFEST.md','PLAN-TRACEABILITY.md','ARCHITECTURE.md','README.md','SBOM.spdx.json',
            'tests/r329-release-truth-regression.php','tests/r330-final-adversarial-regression.php',
            'tests/r320-final-release-regression.php','tests/three-plan-completion-unit.php',
            'tests/r309-release-truth-regression.php',
            '.github/workflows/baseline-integrity.yml','.github/workflows/canonical-storage-and-docs.yml',
            '.github/workflows/file00-1.2.43-real-integration.yml'
          ]
          for name in current_files:
              p=Path(name); s=p.read_text()
              if '1.2.3' not in s: raise SystemExit(f'expected current 1.2.3 reference missing in {name}')
              p.write_text(s.replace('1.2.3','1.2.4'))

          old_branch='review/file02-r321-r330-2026-08-14'
          new_branch='fix/file02-account-taxonomy-parity-1.2.4'
          branch_truth_files=[
            'RELEASE-MANIFEST.md','README.md','STATUS.md',
            'tests/r319-release-contract-truth-regression.php','tests/r329-release-truth-regression.php','tests/r320-final-release-regression.php',
            '.github/workflows/canonical-storage-and-docs.yml','.github/workflows/baseline-integrity.yml'
          ]
          for name in branch_truth_files:
              p=Path(name); s=p.read_text()
              if old_branch in s: p.write_text(s.replace(old_branch,new_branch))

          p=Path('readme.txt'); s=p.read_text()
          s=s.replace('Stable tag: 1.2.3','Stable tag: 1.2.4',1)
          old='Version 1.2.3 is the current R321–R329 repository/source candidate. It retains the 1.2.2 schema/passkey foundations and adds centralized Safe Mode containment, evidence-honest recovery/session behavior, bounded asynchronous retries, Google/passkey containment hardening, privacy-erasure continuation and stable logical-identity legacy migration. DB identity remains 1.2.1 and passkey schema identity remains 1.0.1. Source/CI completion does not by itself prove Hostinger staging, deployment or operations.'
          new='Version 1.2.4 is the current post-R331 repository/source candidate. It retains the R321–R330 hardening and adds canonical File 00 account-taxonomy parity without aliases or lossy remapping. DB identity remains 1.2.1 and passkey schema identity remains 1.0.1. Source/CI completion does not by itself prove Hostinger staging, deployment or operations.'
          if old not in s: raise SystemExit('readme current-truth preimage missing')
          s=s.replace(old,new,1)
          anchor='== Changelog ==\n\n= 1.2.3 ='
          addition='== Changelog ==\n\n= 1.2.4 =\n* Aligns File 02 declared account choices with File 00 canonical account taxonomy: member, patient, student, doctor, teacher, researcher, pharmacy, clinic and publisher.\n* Removes provider-only clinic_staff and institution_representative aliases from the public account-choice contract; no lossy remap is introduced.\n* Preserves DB 1.2.1, passkey schema 1.0.1 and all staging/live/operational non-claims.\n\n= 1.2.3 ='
          if anchor not in s: raise SystemExit('readme changelog anchor missing')
          p.write_text(s.replace(anchor,addition,1))

          p=Path('CHANGELOG.md'); s=p.read_text(); anchor='## 1.2.3 — R321–R330 Corrective Hardening Candidate'
          addition='''## 1.2.4 — Canonical Account Taxonomy Parity Candidate\n\n### Corrected\n\n- File 02 public account choices now use the File 00 canonical taxonomy directly: `member`, `patient`, `student`, `doctor`, `teacher`, `researcher`, `pharmacy`, `clinic`, `publisher`.\n- Provider-only `clinic_staff` and `institution_representative` aliases are no longer exposed as File 02 account choices; no lossy remap is performed.\n- Permanent R331/R332 regressions preserve taxonomy parity, release identity and non-live completion boundaries.\n\n### Identity\n\n- Runtime: `1.2.4`.\n- File 02 DB schema identity remains `1.2.1`.\n- Passkey schema identity remains `1.0.1`; passkey assurance contract remains `1.0.0`.\n\n'''+anchor
          if anchor not in s: raise SystemExit('CHANGELOG 1.2.3 anchor missing')
          p.write_text(s.replace(anchor,addition,1))

          p=Path('REVIEW-REPORT.md'); s=p.read_text()
          old='Current source truth is the R321–R330 corrective line and version 1.2.3 / DB 1.2.1 / passkey schema 1.0.1, subject to the separate release/staging/live gates.'
          new='Current source truth is the post-R331/R332 corrective line and version 1.2.4 / DB 1.2.1 / passkey schema 1.0.1, subject to the separate release/staging/live gates.'
          if old not in s: raise SystemExit('REVIEW-REPORT current truth preimage missing')
          p.write_text(s.replace(old,new,1))

          p=Path('RELEASE-LOCK.json'); data=json.loads(p.read_text())
          data['release_version']='1.2.4'; data['candidate_branch']=new_branch
          data['package_name']='02-sabri-authentication-1.2.4-SOURCE-CANDIDATE.zip'; data['manifest_name']='02-sabri-authentication-1.2.4-MANIFEST.json'
          data['status']['coded']='taxonomy_parity_candidate_r332_corrected'; data['status']['packaged']='not_claimed_from_review_branch'; data['status']['automated_qa']='exact_head_pending_after_r332'
          data['status']['staging_accepted']=False; data['status']['live_deployed']=False; data['status']['operational']=False
          data['review_line']='R331-R332-corrective'
          data['cross_file_blockers']=['File 00 taxonomy-provider source correction is tested, but release closure requires a distinct File 00 1.2.44 exact candidate pin and two-sided integration proof before this blocker is removed.']
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          Path('tests/r332-release-identity-regression.php').write_text('''<?php\n$root=dirname(__DIR__);$main=file_get_contents($root.'/sabri-authentication.php');$registration=file_get_contents($root.'/includes/class-sa-registration.php');$lock=json_decode(file_get_contents($root.'/RELEASE-LOCK.json'),true);$readme=file_get_contents($root.'/readme.txt');$status=file_get_contents($root.'/STATUS.md');$baseline=file_get_contents($root.'/.github/workflows/baseline-integrity.yml');$docs=file_get_contents($root.'/.github/workflows/canonical-storage-and-docs.yml');$integration=file_get_contents($root.'/.github/workflows/file00-1.2.43-real-integration.yml');$fail=array();$req=static function($ok,$m)use(&$fail){if(!$ok)$fail[]=$m;};\n$req(false!==strpos($main,'Version: 1.2.4')&&false!==strpos($main,"SAUTH_VERSION', '1.2.4"),'runtime identity not 1.2.4');$req(false!==strpos($main,"SAUTH_DB_VERSION', '1.2.1"),'DB identity changed');$req(is_array($lock)&&'1.2.4'===($lock['release_version']??''),'release lock not 1.2.4');$req('1.2.1'===($lock['database_version']??'')&&'1.0.1'===($lock['passkey_schema_version']??''),'schema identities changed');$req(false===($lock['status']['staging_accepted']??true)&&false===($lock['status']['live_deployed']??true)&&false===($lock['status']['operational']??true),'external completion falsely advanced');$req(false!==strpos($readme,'Stable tag: 1.2.4')&&false!==strpos($readme,'= 1.2.4 =')&&false!==strpos($readme,'= 1.2.3 ='),'WordPress readme identity/history invalid');$req(false!==strpos($status,'Version 1.2.4'),'status identity stale');$req(false!==strpos($baseline,"RELEASE_VERSION: '1.2.4'"),'baseline workflow identity stale');$req(false!==strpos($docs,"'release_version':'1.2.4'"),'docs workflow identity stale');$req(false!==strpos($integration,"FILE02_VERSION: '1.2.4'"),'real integration File02 identity stale');$req(false!==strpos($registration,"'patient'")&&false!==strpos($registration,"'pharmacy'")&&false!==strpos($registration,"'clinic'")&&false!==strpos($registration,"'publisher'"),'canonical account choices incomplete');$req(file_exists($root.'/review-evidence/R332-REVIEW-FROZEN.md'),'R332 frozen review evidence missing');$req(!file_exists($root.'/.github/workflows/tmp-account-taxonomy-parity-apply.yml'),'temporary taxonomy workflow remains');if($fail){fwrite(STDERR,"R332 regressions:\n- ".implode("\n- ",$fail)."\n");exit(1);}echo 'R332 release identity regression PASS (13 assertions).'.PHP_EOL;\n''')
          Path('.github/workflows/tmp-account-taxonomy-parity-apply.yml').unlink()
          PY
          git diff --check
      - name: Full cumulative source regression before commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find . -type f -name '*.php' -not -path './.git/*' -print | sort)
          test "${#php_files[@]}" -ge 40
          for file in "${php_files[@]}"; do php -l "$file" >/dev/null; done
          tests=(tests/security-unit.php tests/cf01-assurance-unit.php tests/professional-reauthentication-unit.php tests/plan-harmonization-unit.php tests/registration-authentication-unit.php tests/complete-plan-unit.php tests/passkey-webauthn-unit.php tests/three-plan-completion-unit.php tests/storage-migration-unit.php tests/r291-r300-review-regression.php tests/r299-cross-flow-regression.php)
          for extra in tests/r30*-regression.php tests/r31*-regression.php tests/r32*-regression.php tests/r33*-regression.php; do [ -e "$extra" ] && tests+=("$extra"); done
          declare -A seen=(); for test_file in "${tests[@]}"; do if [ -z "${seen[$test_file]+x}" ]; then php "$test_file"; seen[$test_file]=1; fi; done
          node --check assets/js/authentication.js
          git diff --check
      - name: Record R332 completion only after green cumulative suite
        shell: bash
        run: |
          set -euo pipefail
          cat > review-evidence/R332-completion.md <<'EOF'
          # R332 — Correction and Retest Evidence

          R332 was reviewed and frozen before correction. The corrected candidate advances the source runtime identity to 1.2.4 after the R331 canonical account-taxonomy change while preserving DB 1.2.1, passkey schema 1.0.1, passkey assurance contract 1.0.0, and all staging/live/operational non-claims.

          Complete PHP lint and the cumulative no-network source regression set, including permanent R331 and R332 regressions, passed before this correction commit was created.

          The remaining dependency is cross-file: File 00 must receive a distinct 1.2.44 taxonomy-provider release identity and then be exact-pinned in the File 02 real integration gate. This evidence does not claim that dependency is already closed.

          Exact deployed code ابھی unverified ہے؛ repository-based diagnosis provisional ہے۔
          EOF
          sed -i 's/^          //' review-evidence/R332-completion.md
          git diff --check
      - name: Commit corrected exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A; git diff --cached --check
          git config user.name 'majidhussainqadri1-dot'; git config user.email 'majidhussainqadri1@gmail.com'
          git commit -m 'R332: advance File 02 to 1.2.4 after canonical taxonomy correction'
          git push origin HEAD:fix/file02-account-taxonomy-parity-1.2.4
