name: R299 Batch Correction

on:
  push:
    branches:
      - review/file02-r291-r300-main-2026-08-14

permissions:
  contents: write

jobs:
  correct:
    if: startsWith(github.event.head_commit.message, 'R299 fixer bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact fixer bootstrap head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Apply complete R299 defect ledger only after review freeze
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/r299-batch-fix.py')
          text = p.read_text(encoding='utf-8')
          old = '''    "          php tests/r291-r300-review-regression.php\\n",\n    "          php tests/r291-r300-review-regression.php\\n          php tests/r299-cross-flow-regression.php\\n"'''
          new = '''    "            tests/r291-r300-review-regression.php\\n",\n    "            tests/r291-r300-review-regression.php\\n            tests/r299-cross-flow-regression.php\\n"'''
          if old not in text:
              raise SystemExit('review-workflow patch specification not found in fixer')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/r299-batch-fix.py
          sed -i 's/[[:space:]]\+$//' PLAN-TRACEABILITY.md
          git diff --check
          test -f tests/r299-cross-flow-regression.php

      - name: Remove temporary fixer and commit corrected state
        run: |
          set -euo pipefail
          git rm -f tools/r299-batch-fix.py .github/workflows/r299-batch-correction.yml
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R299: correct cross-flow security, lifecycle and truth defects'
          git push origin HEAD:review/file02-r291-r300-main-2026-08-14
