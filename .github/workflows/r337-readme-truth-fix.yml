name: R337 Readme Truth Fix

on:
  push:
    branches:
      - review/file02-r337-fresh-audit-2026-08-16

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r337-readme]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: review/file02-r337-fresh-audit-2026-08-16
      - name: Replace exact stale release copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('readme.txt')
          text = p.read_text()
          old = "Version 1.2.6 is the current post-R331 repository/source candidate. It retains the R321–R330 hardening and adds canonical File 00 account-taxonomy parity without aliases or lossy remapping. DB identity remains 1.2.1 and passkey schema identity remains 1.0.1. Source/CI completion does not by itself prove Hostinger staging, deployment or operations."
          new = "Version 1.2.6 is the current R337 corrective repository/source candidate. R337 was fully reviewed and frozen before correction, found seven verified defects (four High and three Medium), and hardens the File 00 1.2.44+/WordPress 6.4+ dependency boundary, canonical professional-account age prevalidation, passkey credential-state persistence, synchronous session-projection failure containment, WordPress administrative-email compatibility and release-evidence truth. DB identity remains 1.2.1 and passkey schema identity remains 1.0.1. Exact-head QA, post-R337 File 00 paired integration, Hostinger staging, deployment and operations remain separate gates."
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale release paragraph, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = "= 1.2.6 =\n* Corrects the proven MariaDB legacy passkey index-name collision:"
          replacement = "= 1.2.6 =\n* R337 fresh review/fix cycle: seven verified defects corrected after the full review ledger was frozen; no live/staging claim is made.\n* Requires File 00 1.2.44+ and WordPress 6.4+; aligns professional-account age validation to canonical account types.\n* Passkey authentication now proves credential security-state persistence before success, and session-registry persistence failure terminates authentication synchronously.\n* Preserves WordPress confirm_admin_email as a WordPress-owned administrative ceremony and aligns release evidence to the R337 review line.\n* Corrects the proven MariaDB legacy passkey index-name collision:"
          if text.count(marker) != 1:
              raise SystemExit(f'expected one 1.2.6 changelog marker, found {text.count(marker)}')
          p.write_text(text.replace(marker, replacement, 1))
          PY
          git diff --check
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 02 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/r337-readme-truth-fix.yml
          git add readme.txt
          git commit -m '[r337-readme] align readme with R337 source truth'
          git push origin HEAD:review/file02-r337-fresh-audit-2026-08-16
