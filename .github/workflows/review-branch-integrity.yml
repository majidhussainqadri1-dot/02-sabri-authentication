name: File 02 Review Branch Integrity

on:
  pull_request:
  push:
    branches:
      - review/**

permissions:
  contents: read

jobs:
  review-source-integrity:
    name: Review-only exact-head lint and cumulative regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.3'
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact immutable head
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          extensions: openssl

      - name: Lint every PHP file
        run: |
          set -uo pipefail
          mapfile -t php_files < <(find . -type f -name '*.php' -not -path './.git/*' -print | sort)
          test "${#php_files[@]}" -ge 40 || exit 1
          : > "$RUNNER_TEMP/php-lint-failures-${{ matrix.php }}.txt"
          failed=0
          for file in "${php_files[@]}"; do
            if ! output="$(php -l "$file" 2>&1)"; then
              printf '%s\n%s\n\n' "$file" "$output" | tee -a "$RUNNER_TEMP/php-lint-failures-${{ matrix.php }}.txt"
              failed=1
            fi
          done
          exit "$failed"

      - name: Retain lint diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file02-review-lint-${{ matrix.php }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/php-lint-failures-${{ matrix.php }}.txt

      - name: Run cumulative no-network source suites
        run: |
          set -uo pipefail
          tests=(
            tests/security-unit.php
            tests/cf01-assurance-unit.php
            tests/professional-reauthentication-unit.php
            tests/plan-harmonization-unit.php
            tests/registration-authentication-unit.php
            tests/complete-plan-unit.php
            tests/passkey-webauthn-unit.php
            tests/three-plan-completion-unit.php
            tests/storage-migration-unit.php
            tests/r291-r300-review-regression.php
            tests/r299-cross-flow-regression.php
            tests/r302-migration-postcondition-regression.php
            tests/r303-registration-recovery-regression.php
            tests/r304-google-auth-regression.php
          )
          : > "$RUNNER_TEMP/php-suite-failures-${{ matrix.php }}.txt"
          failed=0
          for test_file in "${tests[@]}"; do
            if ! output="$(php "$test_file" 2>&1)"; then
              printf '%s\n%s\n\n' "$test_file" "$output" | tee -a "$RUNNER_TEMP/php-suite-failures-${{ matrix.php }}.txt"
              failed=1
            fi
          done
          exit "$failed"

      - name: Retain suite diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file02-review-suites-${{ matrix.php }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/php-suite-failures-${{ matrix.php }}.txt

      - name: Validate JavaScript and CSS source
        run: |
          set -euo pipefail
          node --check assets/js/authentication.js
          python3 - <<'PY'
          import pathlib
          css = pathlib.Path('assets/css/authentication.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')
          if 'orange' in css.lower() or '#f97316' in css.lower():
              raise SystemExit('superseded orange-primary token found')
          print('Review-branch JS/CSS structural checks passed.')
          PY

      - name: Enforce review-only artifact boundary
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tgz' -o -name '*.7z' -o -name '*.rar' \) -not -path './.git/*' | grep -q .; then
            echo 'Review branch must not contain installable/archive artifacts.' >&2
            exit 1
          fi
          echo 'No installable artifact was built or retained by this review workflow.'
