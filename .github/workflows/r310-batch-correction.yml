name: R310 Final Adversarial Correction

on:
  push:
    branches:
      - review/file02-r301-r310-2026-08-14

permissions:
  contents: write

jobs:
  correct:
    if: startsWith(github.event.head_commit.message, 'R310 fixer bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Repair structure-sensitive R310 patch and apply frozen ledger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/r310-fix.py')
          text = p.read_text(encoding='utf-8')

          # The original fixer assumed deactivate() followed maybe_install(); the
          # real current class places ensure_manager_page() there. Keep the
          # replacement bounded to maybe_install only.
          old_end = '''end = text.index("\\n\\tpublic static function deactivate()", start)'''
          new_end = '''end = text.index("\\n\\tprivate static function ensure_manager_page()", start)'''
          if old_end not in text:
              raise SystemExit('R310 passkey end-marker patch point missing')
          text = text.replace(old_end, new_end, 1)

          # Preserve the exact current passkey table contract while adding the
          # R310 installation postconditions. Do not silently rename/drop schema
          # columns during a lifecycle hardening review.
          replacements = {
              'public_id varchar(64) NOT NULL,': 'public_id char(36) NOT NULL,',
              'credential_lookup char(64) NOT NULL,': 'credential_lookup_hash char(64) NOT NULL,',
              'credential_ciphertext longtext NOT NULL,': 'credential_id_ciphertext longtext NOT NULL,',
              'public_key_pem longtext NOT NULL,\\n\\t\\t\\tsign_count bigint unsigned NOT NULL DEFAULT 0,': "public_key_pem longtext NOT NULL,\\n\\t\\t\\talgorithm varchar(20) NOT NULL DEFAULT 'ES256',\\n\\t\\t\\tsign_count bigint unsigned NOT NULL DEFAULT 0,",
              "attachment varchar(32) NOT NULL DEFAULT '',\\n\\t\\t\\tbackup_eligible tinyint unsigned NOT NULL DEFAULT 0,": "attachment varchar(32) NOT NULL DEFAULT '',\\n\\t\\t\\ttransports text NOT NULL,\\n\\t\\t\\tdiscoverable tinyint(1) NOT NULL DEFAULT 1,\\n\\t\\t\\tbackup_eligible tinyint(1) NOT NULL DEFAULT 0,\\n\\t\\t\\tbackup_state tinyint(1) NOT NULL DEFAULT 0,\\n\\t\\t\\thardware_backed tinyint(1) NOT NULL DEFAULT 0,",
              'UNIQUE KEY credential_lookup (credential_lookup),': 'UNIQUE KEY credential_lookup_hash (credential_lookup_hash),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('R310 passkey schema preservation patch point missing: ' + old)
              text = text.replace(old, new, 1)

          # Replace the brittle activator storage_ready edit with a structural
          # insertion immediately before its single final return true.
          old_storage = '''text = text.replace("\\t\\t}\\n\\t\\treturn true;\\n\\t}\\n\\n\\tpublic static function create_pages()", "\\t\\t}\\n\\t\\tif ( ! class_exists( 'SAUTH_Passkeys' ) || ! SAUTH_Passkeys::installation_ready() ) { return false; }\\n\\t\\treturn true;\\n\\t}\\n\\n\\tpublic static function create_pages()", 1)'''
          new_storage = '''storage_pattern = re.compile(
              r"(\\tpublic static function storage_ready\\(\\) \\{.*?)(\\t\\treturn true;\\n\\t\\})",
              re.S,
          )
          storage_matches = list(storage_pattern.finditer(text))
          if len(storage_matches) != 1:
              raise SystemExit(f'expected one storage_ready block, found {len(storage_matches)}')
          text = storage_pattern.sub(
              lambda m: m.group(1) + "\\t\\tif ( ! class_exists( 'SAUTH_Passkeys' ) || ! SAUTH_Passkeys::installation_ready() ) { return false; }\\n" + m.group(2),
              text,
              count=1,
          )'''
          if old_storage not in text:
              raise SystemExit('R310 brittle storage_ready patch point missing')
          text = text.replace(old_storage, new_storage, 1)

          p.write_text(text, encoding='utf-8')
          PY
          python3 tools/r310-fix.py
          git diff --check
          php -l includes/class-sa-security.php
          php -l includes/class-sauth-passkeys.php
          php -l includes/class-sa-activator.php
          php -l includes/class-sauth-operations.php
          php -l includes/class-sa-google-oauth.php
          php -l includes/class-sa-plugin.php
          php -l templates/partials/notice.php
          php -l tests/security-unit.php
          php -l tests/r310-final-adversarial-regression.php
          php tests/security-unit.php
          php tests/r302-migration-postcondition-regression.php
          php tests/r305-passkey-lifecycle-regression.php
          php tests/r307-privacy-operations-regression.php
          php tests/r308-route-ui-regression.php
          php tests/r309-release-truth-regression.php
          php tests/r310-final-adversarial-regression.php
      - name: Commit R310 corrected state
        run: |
          set -euo pipefail
          git rm tools/r310-fix.py
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R310: final adversarial correction of activation, security and recovery edges'
          git push origin HEAD:review/file02-r301-r310-2026-08-14
