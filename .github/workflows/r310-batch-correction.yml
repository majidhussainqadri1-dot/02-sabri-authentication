name: R310 Final Adversarial Correction

on:
  push:
    branches:
      - review/file02-r301-r310-2026-08-14

permissions:
  contents: write

jobs:
  correct:
    if: startsWith(github.event.head_commit.message, 'R310 fixer bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Repair structure-aware R310 activator patch and apply frozen ledger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/r310-fix.py')
          text = p.read_text(encoding='utf-8')
          old = '''text = text.replace("\\t\\t}\\n\\t\\treturn true;\\n\\t}\\n\\n\\tpublic static function create_pages()", "\\t\\t}\\n\\t\\tif ( ! class_exists( 'SAUTH_Passkeys' ) || ! SAUTH_Passkeys::installation_ready() ) { return false; }\\n\\t\\treturn true;\\n\\t}\\n\\n\\tpublic static function create_pages()", 1)'''
          new = '''storage_pattern = re.compile(
              r"(\\tpublic static function storage_ready\\(\\) \\{.*?)(\\t\\treturn true;\\n\\t\\})",
              re.S,
          )
          storage_matches = list(storage_pattern.finditer(text))
          if len(storage_matches) != 1:
              raise SystemExit(f'expected one storage_ready block, found {len(storage_matches)}')
          text = storage_pattern.sub(
              lambda m: m.group(1) + "\\t\\tif ( ! class_exists( 'SAUTH_Passkeys' ) || ! SAUTH_Passkeys::installation_ready() ) { return false; }\\n" + m.group(2),
              text,
              count=1,
          )'''
          if old not in text:
              raise SystemExit('brittle R310 storage_ready patch line not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/r310-fix.py
          git diff --check
          php -l includes/class-sa-security.php
          php -l includes/class-sauth-passkeys.php
          php -l includes/class-sa-activator.php
          php -l includes/class-sauth-operations.php
          php -l includes/class-sa-google-oauth.php
          php -l includes/class-sa-plugin.php
          php -l templates/partials/notice.php
          php -l tests/security-unit.php
          php -l tests/r310-final-adversarial-regression.php
          php tests/security-unit.php
          php tests/r302-migration-postcondition-regression.php
          php tests/r305-passkey-lifecycle-regression.php
          php tests/r307-privacy-operations-regression.php
          php tests/r308-route-ui-regression.php
          php tests/r309-release-truth-regression.php
          php tests/r310-final-adversarial-regression.php
      - name: Commit R310 corrected state
        run: |
          set -euo pipefail
          git rm tools/r310-fix.py
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R310: final adversarial correction of activation, security and recovery edges'
          git push origin HEAD:review/file02-r301-r310-2026-08-14
