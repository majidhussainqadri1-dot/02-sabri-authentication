name: R337 Integration Trigger Fix

on:
  push:
    branches:
      - review/file02-r337-fresh-audit-2026-08-16

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r337-integration-trigger]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: review/file02-r337-fresh-audit-2026-08-16
      - name: Add review branch trigger to permanent paired integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/file00-1.2.44-real-integration.yml')
          text = p.read_text()
          old = "    branches:\n      - main\n      - fix/**\n"
          new = "    branches:\n      - main\n      - fix/**\n      - review/**\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one push branch block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 02 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/r337-integration-trigger-fix.yml
          git add .github/workflows/file00-1.2.44-real-integration.yml
          git commit -m '[r337-integration-trigger] run paired File 00 integration on review branches'
          git push origin HEAD:review/file02-r337-fresh-audit-2026-08-16
