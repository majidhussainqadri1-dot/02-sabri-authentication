name: File 02 Canonical Storage and Documentation

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
      - fix/**

permissions:
  contents: read

jobs:
  canonical-storage-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git diff --check

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: openssl

      - name: Verify canonical storage and current migration regressions
        run: |
          set -euo pipefail
          php tests/storage-migration-unit.php
          php tests/passkey-webauthn-unit.php
          php tests/r302-migration-postcondition-regression.php
          php tests/r305-passkey-lifecycle-regression.php
          php tests/r307-privacy-operations-regression.php
          php tests/r308-route-ui-regression.php
          php tests/r309-release-truth-regression.php
          grep -Fq "SAUTH_Storage_Router::init();" sabri-authentication.php
          grep -Fq "SAUTH_Passkeys::maybe_install( true )" includes/class-sauth-operations.php
          grep -Fq "storage_ready()" includes/class-sa-activator.php
          grep -Fq "authentication_ready()" includes/class-sauth-passkeys.php

      - name: Verify documentation truth markers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          expected = {
            'README.md': ('1.2.1','review/file02-r301-r310-2026-08-14','c4ab298b3ba2b870d507d32b36b1b4afd2771621'),
            'STATUS.md': ('1.2.1','review/file02-r301-r310-2026-08-14','Live-Deployed'),
            'RELEASE-MANIFEST.md': ('1.2.1','Exact-head evidence rule','c4ab298b3ba2b870d507d32b36b1b4afd2771621'),
            'ARCHITECTURE.md': ('1.2.1','dedicated-`SA_MASTER_KEY`','retired File 00'),
            'CONTRACTS.md': ('1.2.1','retired File 00 factor codes','WebAuthn ceremony contract'),
            'MIGRATION.md': ('1.2.1','Fresh installation of 1.2.1','SA_MASTER_KEY'),
            'STAGING-ACCEPTANCE.md': ('1.2.1','All eight File 02 tables/indexes','passkey'),
            'INCIDENT.md': ('live symptom → live evidence','Repository HEAD / Deployed Version / DB Version / Migration State / Live Verification Status','Exact deployed code ابھی unverified ہے'),
          }
          for path, markers in expected.items():
              text=pathlib.Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      print(f'ERROR: {path} missing {marker}', file=sys.stderr)
                      raise SystemExit(1)
          lock=json.loads(pathlib.Path('RELEASE-LOCK.json').read_text())
          if lock.get('transport_repository') != '02-sabri-authentication': raise SystemExit('release-lock transport repo mismatch')
          print('Canonical documentation truth PASS.')
          PY
