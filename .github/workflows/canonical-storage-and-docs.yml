name: File 02 Canonical Storage and Documentation

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
      - fix/**

permissions:
  contents: read

jobs:
  canonical-storage-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git diff --check
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: openssl
      - name: Verify canonical storage and cumulative migration regressions
        run: |
          set -euo pipefail
          php tests/storage-migration-unit.php
          php tests/passkey-webauthn-unit.php
          php tests/r302-migration-postcondition-regression.php
          php tests/r305-passkey-lifecycle-regression.php
          php tests/r307-privacy-operations-regression.php
          php tests/r308-route-ui-regression.php
          php tests/r309-release-truth-regression.php
          for extra in tests/r31*-regression.php tests/r32*-regression.php; do [ -e "$extra" ] && php "$extra"; done
          grep -Fq "SAUTH_Storage_Router::init();" sabri-authentication.php
          grep -Fq "storage_ready()" includes/class-sa-activator.php
          grep -Fq "table_indexes_ready" includes/class-sa-activator.php
          grep -Fq "table_schema_ready" includes/class-sauth-passkeys.php
          grep -Fq "SHOW INDEX FROM" includes/class-sauth-passkeys.php
      - name: Verify current documentation truth markers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          expected={
            'README.md':('1.2.2','review/file02-r311-r320-2026-08-14'),
            'STATUS.md':('Version 1.2.2','1.2.2 / 1.2.1','Live-Deployed'),
            'RELEASE-MANIFEST.md':('1.2.2','Exact-head evidence rule'),
            'ARCHITECTURE.md':('1.2.2','dedicated-`SA_MASTER_KEY`','retired File 00'),
            'CONTRACTS.md':('1.2.2','retired File 00 factor codes','SAUTH_Passkey_Runtime::current_assurance'),
            'MIGRATION.md':('1.2.2','Fresh installation of 1.2.2','credential_lookup_hash'),
            'STAGING-ACCEPTANCE.md':('Version 1.2.2','All eight File 02 tables/indexes','passkey'),
            'INCIDENT.md':('live symptom → live evidence','Repository HEAD / Deployed Version / DB Version / Migration State / Live Verification Status','Exact deployed code ابھی unverified ہے'),
          }
          for path,markers in expected.items():
              text=pathlib.Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      print(f'ERROR: {path} missing {marker}',file=sys.stderr); raise SystemExit(1)
          lock=json.loads(pathlib.Path('RELEASE-LOCK.json').read_text())
          required={'release_version':'1.2.2','database_version':'1.2.1','passkey_schema_version':'1.0.1','transport_repository':'02-sabri-authentication'}
          for k,v in required.items():
              if lock.get(k)!=v: raise SystemExit('release-lock mismatch: '+k)
          print('Canonical documentation truth PASS.')
          PY
