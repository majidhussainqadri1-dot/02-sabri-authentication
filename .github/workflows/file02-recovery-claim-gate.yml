name: File 02 recovery one-time claim regression
on:
  pull_request:
    paths:
      - 'includes/class-sauth-security-orchestrator.php'
      - 'tests/recovery-once-claim-gate.php'
      - '.github/workflows/file02-recovery-claim-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-claim-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax validation
        run: php -l tests/recovery-once-claim-gate.php && php -l includes/class-sauth-security-orchestrator.php
      - name: Fail-first ordering regression (expected red until corrected)
        run: php tests/recovery-once-claim-gate.php
