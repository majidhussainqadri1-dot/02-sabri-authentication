name: File 02 collision proof fail-first evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failfirst-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact candidate checkout
        run: test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: PHP lint
        run: |
          php -l tests/security/collision-url-proof-regression.php
          php -l tests/security/collision-handoff-mock-regression.php
          php -l includes/class-sauth-security-orchestrator.php
      - name: Confirm collision URL transport regression is GREEN
        run: php tests/security/collision-url-proof-regression.php
      - name: Exercise transient handoff with isolated WP mocks
        run: php tests/security/collision-handoff-mock-regression.php
      - name: Verify server-side handoff source guards
        run: |
          php -r '$s=file_get_contents("includes/class-sauth-security-orchestrator.php"); foreach(["set_transient(", "get_transient(", "delete_transient(", "hash_hmac("] as $required) { if(strpos($s,$required)===false) { fwrite(STDERR,"Missing handoff guard: ".$required."\\n"); exit(1); }} echo "Handoff source guards present\\n";'
