name: File 02 v12 — Breach and DPoP fail-first security gates
on:
  pull_request:
    paths:
      - 'includes/class-sauth-password-safety.php'
      - 'includes/class-sauth-dpop.php'
      - 'tests/security/breach-prefix-provider-failfirst.php'
      - 'tests/security/dpop-crypto-claim-failfirst.php'
      - 'tests/security/breach-hibp-optin-no-network.php'
      - 'includes/class-sauth-operations.php'
      - 'tests/security/external-provider-operability-truth.php'
      - '.github/workflows/file02-v12-breach-dpop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-and-dpop:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Source and test syntax
        run: php -l includes/class-sauth-password-safety.php && php -l includes/class-sauth-dpop.php && php -l tests/security/breach-prefix-provider-failfirst.php && php -l tests/security/dpop-crypto-claim-failfirst.php
      - name: Password provider unavailable/malformed fail closed
        run: php tests/security/breach-prefix-provider-failfirst.php
      - name: Explicit opt-in HIBP endpoint and data-minimization (offline)
        run: php -l tests/security/breach-hibp-optin-no-network.php && php tests/security/breach-hibp-optin-no-network.php
      - name: DPoP crypto before once-only claim
        if: always()
        run: php tests/security/dpop-crypto-claim-failfirst.php
      - name: Operator visibility of unresolved external adapters (read-only mock)
        run: php -l tests/security/external-provider-operability-truth.php && php tests/security/external-provider-operability-truth.php
      - name: Preserve inherited DPoP replay contract
        run: php tests/security/dpop-proof-and-replay-hardening.php
