name: R337 CI Diagnostic

on:
  push:
    branches:
      - review/file02-r337-fresh-audit-2026-08-16

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[r337-diag]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: review/file02-r337-fresh-audit-2026-08-16
      - name: Run diagnostic suite
        shell: bash
        run: |
          set +e
          mkdir -p review-evidence
          {
            echo "R337 CI diagnostic at $(date -u +%FT%TZ)"
            echo "HEAD=$(git rev-parse HEAD)"
            echo
            echo "Potential stale expectation references:"
            grep -R -n -E "1\.2\.43|Requires at least: 6\.0|clinic_staff|institution_representative" tests .github 2>/dev/null || true
            echo
            tests=(
              tests/security-unit.php
              tests/cf01-assurance-unit.php
              tests/professional-reauthentication-unit.php
              tests/plan-harmonization-unit.php
              tests/registration-authentication-unit.php
              tests/complete-plan-unit.php
              tests/passkey-webauthn-unit.php
              tests/three-plan-completion-unit.php
              tests/storage-migration-unit.php
              tests/r291-r300-review-regression.php
              tests/r299-cross-flow-regression.php
              tests/r302-migration-postcondition-regression.php
              tests/r303-registration-recovery-regression.php
              tests/r304-google-auth-regression.php
              tests/r305-passkey-lifecycle-regression.php
              tests/r306-session-assurance-regression.php
              tests/r307-privacy-operations-regression.php
              tests/r308-route-ui-regression.php
              tests/r309-release-truth-regression.php
              tests/r310-final-adversarial-regression.php
            )
            for extra in tests/r31*-regression.php tests/r32*-regression.php tests/r33*-regression.php; do [ -e "$extra" ] && tests+=("$extra"); done
            declare -A seen=()
            for test_file in "${tests[@]}"; do
              [ -n "${seen[$test_file]+x}" ] && continue
              seen[$test_file]=1
              echo
              echo "=== $test_file ==="
              php "$test_file"
              rc=$?
              echo "exit=$rc"
              if [ "$rc" -ne 0 ]; then echo "FIRST_FAILURE=$test_file"; break; fi
            done
          } > review-evidence/R337-CI-DIAGNOSTIC.txt 2>&1
          exit 0
      - name: Commit diagnostic and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 02 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/r337-ci-diagnostic.yml
          git add review-evidence/R337-CI-DIAGNOSTIC.txt
          git commit -m '[r337-diag] record cumulative regression failure evidence'
          git push origin HEAD:review/file02-r337-fresh-audit-2026-08-16
