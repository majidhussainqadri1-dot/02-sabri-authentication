name: R343 exact integrated draft-login remediation

on:
  push:
    branches:
      - review/file02-live-draft-completion-login-r343-2026-08-31

permissions:
  contents: write

jobs:
  apply-r343:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file02-live-draft-completion-login-r343-2026-08-31
          fetch-depth: 0

      - name: Apply exact R343 remediation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one target in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          old_registration = """\tprivate static function sign_in_allowed( array $assertion, array $completion ) {
          \t\tif ( 'unknown' === ( $assertion['result'] ?? 'unknown' ) || ! empty( $assertion['membership']['suspended'] ) ) { return false; }
          \t\tif ( 'allow' === ( $assertion['result'] ?? '' ) ) { return true; }
          \t\t$active = true === ( $assertion['membership']['active'] ?? false );
          \t\treturn $active
          \t\t\t&& 'allow' === ( $completion['result'] ?? '' )
          \t\t\t&& ! empty( $completion['missing_steps'] )
          \t\t\t&& ! empty( $completion['next_route'] );
          \t}
          """
          delegate = """\tprivate static function sign_in_allowed( array $assertion, array $completion ) {
          \t\treturn SA_Membership_Adapter::sign_in_allowed( $assertion, $completion );
          \t}
          """
          replace_once('includes/class-sa-registration.php', old_registration, delegate)

          old_shared = """\tprivate static function sign_in_allowed( array $assertion, array $completion ) {
          \t\tif ( 'unknown' === ( $assertion['result'] ?? 'unknown' ) || ! empty( $assertion['membership']['suspended'] ) ) {
          \t\t\treturn false;
          \t\t}
          \t\tif ( 'allow' === ( $assertion['result'] ?? '' ) ) {
          \t\t\treturn true;
          \t\t}
          \t\t$active = true === ( $assertion['membership']['active'] ?? false );
          \t\treturn $active
          \t\t\t&& 'allow' === ( $completion['result'] ?? '' )
          \t\t\t&& ! empty( $completion['missing_steps'] )
          \t\t\t&& ! empty( $completion['next_route'] );
          \t}
          """
          replace_once('includes/class-sauth-passkeys.php', old_shared, delegate)
          replace_once('includes/class-sauth-passkey-runtime.php', old_shared, delegate)

          old_google = """\t\t\tif ( ! self::link_locks_owned( $lock, (string) $claims['sub'], $user->ID )
          \t\t\t\t|| ! ( $locked_user instanceof WP_User )
          \t\t\t\t|| $locked_user->ID !== $user->ID
          \t\t\t\t|| 0 !== strcasecmp( (string) $locked_user->user_email, (string) $claims['email'] )
          \t\t\t\t|| ! SA_Membership_Adapter::can_use_google( $locked_user->ID ) ) {
          \t\t\t\t$login_error = 'The linked membership is not eligible for Google sign-in.';
          \t\t\t} else {
          \t\t\t\t$completion = SAUTH_Account_Contract::completion_state( $locked_user->ID, array( 'purpose' => 'google_sign_in' ) );
          \t\t\t\tif ( ! is_array( $completion ) || 'allow' !== ( $completion['result'] ?? '' ) ) {
          \t\t\t\t\t$login_error = 'Account completion status could not be verified for Google sign-in.';
          \t\t\t\t} else {
          """
          new_google = """\t\t\tif ( ! self::link_locks_owned( $lock, (string) $claims['sub'], $user->ID )
          \t\t\t\t|| ! ( $locked_user instanceof WP_User )
          \t\t\t\t|| $locked_user->ID !== $user->ID
          \t\t\t\t|| 0 !== strcasecmp( (string) $locked_user->user_email, (string) $claims['email'] ) ) {
          \t\t\t\t$login_error = 'The linked Google account could not be verified safely.';
          \t\t\t} else {
          \t\t\t\t$completion = SAUTH_Account_Contract::completion_state( $locked_user->ID, array( 'purpose' => 'google_sign_in' ) );
          \t\t\t\t$membership = SA_Membership_Adapter::membership_assertion( $locked_user->ID, 'clinical_identity_link', 'google_sign_in' );
          \t\t\t\tif ( ! is_array( $completion ) || 'allow' !== ( $completion['result'] ?? '' ) ) {
          \t\t\t\t\t$login_error = 'Account completion status could not be verified for Google sign-in.';
          \t\t\t\t} elseif ( ! SA_Membership_Adapter::sign_in_allowed( $membership, $completion ) ) {
          \t\t\t\t\t$login_error = 'The linked membership is not eligible for Google sign-in.';
          \t\t\t\t} else {
          """
          replace_once('includes/class-sa-google-oauth.php', old_google, new_google)

          test = r'''<?php
          /** R343 permanent regression for the live-proven draft-account sign-in deadlock. */
          $root     = dirname( __DIR__ );
          $adapter  = file_get_contents( $root . '/includes/class-sa-membership-adapter.php' );
          $register = file_get_contents( $root . '/includes/class-sa-registration.php' );
          $passkeys = file_get_contents( $root . '/includes/class-sauth-passkeys.php' );
          $runtime  = file_get_contents( $root . '/includes/class-sauth-passkey-runtime.php' );
          $google   = file_get_contents( $root . '/includes/class-sa-google-oauth.php' );
          $fail     = array();
          $req = static function ( $ok, $message ) use ( &$fail ) { if ( ! $ok ) { $fail[] = $message; } };
          $req( false !== strpos( $adapter, 'public static function sign_in_allowed( array $assertion, array $completion )' ), 'central sign-in admission helper missing' );
          $req( false !== strpos( $adapter, "'unknown' === \$result" ), 'unknown membership no longer fail-closed' );
          $req( false !== strpos( $adapter, "membership']['suspended']" ), 'suspended membership guard missing' );
          $req( false !== strpos( $adapter, "'membership_prerequisite_denied'" ), 'completion admission is not constrained to prerequisite denial' );
          $req( false !== strpos( $adapter, "'allow' === ( \$completion['result'] ?? '' )" ), 'completion result must be canonical allow' );
          $req( false !== strpos( $adapter, "! empty( \$completion['missing_steps'] )" ) && false !== strpos( $adapter, "! empty( \$completion['next_route'] )" ), 'completion admission requires missing steps and canonical route' );
          foreach ( array( $register, $passkeys, $runtime ) as $source ) {
              $req( false !== strpos( $source, 'SA_Membership_Adapter::sign_in_allowed( $assertion, $completion )' ), 'authentication surface does not delegate to central completion-aware admission' );
          }
          $req( false !== strpos( $google, "\$membership = SA_Membership_Adapter::membership_assertion( \$locked_user->ID, 'clinical_identity_link', 'google_sign_in' );" ), 'Google sign-in does not obtain the same canonical membership assertion' );
          $req( false !== strpos( $google, 'SA_Membership_Adapter::sign_in_allowed( $membership, $completion )' ), 'Google sign-in bypasses completion-aware admission' );
          $req( false === strpos( $google, '|| ! SA_Membership_Adapter::can_use_google( $locked_user->ID ) )' ), 'Google sign-in still requires fully eligible membership before completion' );
          if ( $fail ) { fwrite( STDERR, "R343 draft completion login regressions:\n- " . implode( "\n- ", $fail ) . "\n" ); exit( 1 ); }
          echo 'R343 draft completion login PASS.' . PHP_EOL;
          '''
          Path('tests/r343-live-draft-completion-login-regression.php').write_text(test.replace('          ', ''))

          evidence = '''# R343 — Live draft/incomplete account sign-in deadlock

          Date: 2026-08-31

          ## Live reality frozen before coding

          - Live File 02 version: `1.3.4`.
          - Live File 02 deployed ZIP supplied from Hostinger contained 59 plugin files.
          - The deployed ZIP matched the R342 reviewed package/current `main` tree byte-for-byte: 59/59 files, 0 missing, 0 extra, 0 modified.
          - Repository baseline: `4a657c1b304bc45239c3110c0f2306221f19ceb4`.
          - Live File 00: `1.2.44`; Live File 02 DB version: `1.3.0`.
          - Live test user ID `13` had `wp_smc_applications.status = draft`.
          - Password credentials were accepted, but sign-in was denied as `membership_not_eligible`.

          ## Exact root cause

          The exact deployed sign-in predicate required `membership.active === true` before honoring File 00's separately returned completion state. File 00 intentionally creates new accounts in `draft`, while its authentication account contract returns canonical `missing_steps` and `next_route` so the subject can finish verification. This formed the circular lock: `draft -> inactive -> cannot sign in -> cannot complete -> cannot become active`.

          ## Remediation

          R343 centralizes completion-aware sign-in admission in `SA_Membership_Adapter::sign_in_allowed()`. Unknown and suspended states stay fail-closed. Fully eligible `allow` stays allowed. A canonical `deny` is admitted only when its reason is exactly `membership_prerequisite_denied` and File 00 simultaneously returns completion `allow` with non-empty `missing_steps` and `next_route`. File 00's `membership.active` truth is not rewritten.

          Password, passkey, passkey-runtime and Google sign-in now use the same admission rule.

          ## Release state

          Repository remediation only. Live resolution requires reviewed CI, package deployment, deployment-parity confirmation and live re-test.
          '''
          Path('review-evidence/R343-LIVE-DRAFT-COMPLETION-LOGIN.md').write_text(evidence.replace('          ', ''))

          Path('.github/workflows/r343-self-patch.yml').unlink()

      - name: PHP syntax and R343 regression
        run: |
          php -l includes/class-sa-membership-adapter.php
          php -l includes/class-sa-registration.php
          php -l includes/class-sauth-passkeys.php
          php -l includes/class-sauth-passkey-runtime.php
          php -l includes/class-sa-google-oauth.php
          php -l tests/r343-live-draft-completion-login-regression.php
          php tests/r343-live-draft-completion-login-regression.php

      - name: Commit exact remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R343 fix draft completion sign-in deadlock"
          git push origin HEAD:review/file02-live-draft-completion-login-r343-2026-08-31
