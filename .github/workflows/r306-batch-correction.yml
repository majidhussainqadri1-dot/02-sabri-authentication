name: R306 Batch Correction

on:
  push:
    branches:
      - review/file02-r301-r310-2026-08-14

permissions:
  contents: write

jobs:
  correct:
    if: startsWith(github.event.head_commit.message, 'R306 fixer bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Apply frozen R306 ledger
        run: |
          set -euo pipefail
          python3 tools/r306-fix.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/cf01-assurance-unit.php')
          text = p.read_text(encoding='utf-8')
          needle = "define( 'SAUTH_VERSION', '1.2.1' );\n"
          if "SAUTH_PASSKEY_CONTRACT_VERSION" not in text:
              if needle not in text: raise SystemExit('CF01 version fixture anchor missing')
              text = text.replace(needle, needle + "define( 'SAUTH_PASSKEY_CONTRACT_VERSION', '1.0.0' );\n", 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/professional-reauthentication-unit.php')
          text = p.read_text(encoding='utf-8')
          text = text.replace("$GLOBALS['sa_password_ok'] = true;\n", "$GLOBALS['sa_password_ok'] = true;\n$GLOBALS['sa_user_pass'] = 'stored-hash';\n", 1)
          old = "function get_userdata( $user_id ) { return 7 === (int) $user_id ? (object) array( 'ID' => 7, 'user_pass' => 'stored-hash' ) : false; }\nfunction wp_check_password( $password, $hash, $user_id ) { return (bool) $GLOBALS['sa_password_ok'] && 'stored-hash' === $hash && 7 === (int) $user_id; }"
          new = "function get_userdata( $user_id ) { return 7 === (int) $user_id ? (object) array( 'ID' => 7, 'user_pass' => (string) $GLOBALS['sa_user_pass'] ) : false; }\nfunction wp_check_password( $password, $hash, $user_id ) { return (bool) $GLOBALS['sa_password_ok'] && (string) $GLOBALS['sa_user_pass'] === (string) $hash && 7 === (int) $user_id; }"
          if old not in text: raise SystemExit('professional password fixture anchor missing')
          text = text.replace(old, new, 1)
          anchor = "sa_prof_assert( true === $result['password_verified'], 'existing receipt retains verified-password evidence' );\n"
          addition = "\n$GLOBALS['sa_user_pass'] = 'changed-hash';\n$result = SA_Professional_Reauthentication::assertion( 7, $scope );\nsa_prof_assert( 'invalid' === $result['result'], 'password-hash change revokes professional receipt even before session rotation' );\n$GLOBALS['sa_user_pass'] = 'stored-hash';\n$GLOBALS['sa_auth_result'] = $valid;\nSA_Professional_Reauthentication::verify_and_record( 7, 'password', 'ignored', array( 'scope' => $scope ) );\n"
          if anchor not in text: raise SystemExit('professional assertion insertion anchor missing')
          text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
          cat > tests/r306-session-assurance-regression.php <<'PHP'
          <?php
          $root = dirname( __DIR__ );
          $session = file_get_contents( $root . '/includes/class-sauth-session-manager.php' );
          $risk = file_get_contents( $root . '/includes/class-sauth-login-risk.php' );
          $passkey = file_get_contents( $root . '/includes/class-sauth-passkeys.php' );
          $assurance = file_get_contents( $root . '/includes/class-sa-authentication-assurance.php' );
          $professional = file_get_contents( $root . '/includes/class-sa-professional-reauthentication.php' );
          $fail = array();
          $checks = array(
              array( $session, 'session_registry_read_failed', 'session registry read failure still fails open' ),
              array( $session, '\'active\' === (string) $status ? $user_id : 0', 'unknown/revoked session state can remain authenticated' ),
              array( $session, 'WP_Session_Tokens::get_instance( absint( $user_id ) )->get( $token )', 'lazy session projection ignores real WordPress expiration' ),
              array( $session, 'SET status=\'revoked\', revoked_at=%s, revocation_reason=%s', 'revoke-others still depends on display list limit' ),
              array( $passkey, 'public static function authentication_ready()', 'risk engine lacks passkey readiness contract' ),
              array( $risk, 'strong_authentication_unavailable', 'passkey storage outage can downgrade medium-risk login' ),
              array( $assurance, 'SAUTH_PASSKEY_CONTRACT_VERSION !== (string) ( $passkey[\'contract_version\'] ?? \'\' )', 'derived assurance does not bind passkey contract' ),
              array( $professional, 'password_binding', 'professional receipt is not bound to current password state' ),
              array( $professional, 'unset( $receipt[\'session_binding\'], $receipt[\'fingerprint\'], $receipt[\'password_binding\'] )', 'password binding leaks from public professional receipt' ),
          );
          foreach ( $checks as $c ) { if ( false === strpos( $c[0], $c[1] ) ) { $fail[] = $c[2]; } }
          if ( $fail ) { fwrite( STDERR, "R306 regressions:\n- " . implode( "\n- ", $fail ) . "\n" ); exit( 1 ); }
          echo 'R306 session/assurance regression PASS (' . count( $checks ) . " assertions).\n";
          PHP
          git diff --check
          php -l includes/class-sauth-session-manager.php
          php -l includes/class-sauth-login-risk.php
          php -l includes/class-sauth-passkeys.php
          php -l includes/class-sa-authentication-assurance.php
          php -l includes/class-sa-professional-reauthentication.php
          php -l tests/cf01-assurance-unit.php
          php -l tests/professional-reauthentication-unit.php
          php -l tests/r306-session-assurance-regression.php
          php tests/cf01-assurance-unit.php
          php tests/professional-reauthentication-unit.php
          php tests/complete-plan-unit.php
          php tests/r306-session-assurance-regression.php
      - name: Commit R306 corrected state
        run: |
          set -euo pipefail
          git rm tools/r306-fix.py
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R306: harden session revocation, risk and assurance freshness'
          git push origin HEAD:review/file02-r301-r310-2026-08-14
