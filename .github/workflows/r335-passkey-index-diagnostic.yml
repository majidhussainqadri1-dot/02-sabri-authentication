name: R335 Passkey Legacy Index Diagnostic

on:
  push:
    branches:
      - fix/file02-passkey-dbdelta-migration-1.2.5

permissions:
  contents: read

jobs:
  prove-index-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: diagnostic
          MARIADB_USER: diagnostic
          MARIADB_PASSWORD: diagnostic
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: mysqli
      - name: Prove exact MariaDB key-name behavior used by the failing migration
        run: |
          set -euo pipefail
          php -r '
          $db=new mysqli("127.0.0.1","diagnostic","diagnostic","diagnostic",3306);
          if($db->connect_errno){fwrite(STDERR,$db->connect_error."\n");exit(1);}
          $sql="CREATE TABLE diagnostic_passkeys (
            id bigint unsigned NOT NULL AUTO_INCREMENT,
            public_id char(36) NOT NULL,
            user_id bigint unsigned NOT NULL,
            credential_lookup_hash char(64) NOT NULL,
            credential_id_ciphertext longtext NOT NULL,
            public_key_pem longtext NOT NULL,
            algorithm varchar(20) NOT NULL DEFAULT \"ES256\",
            sign_count bigint unsigned NOT NULL DEFAULT 0,
            nickname varchar(120) NOT NULL DEFAULT \"\",
            attachment varchar(32) NOT NULL DEFAULT \"\",
            transports text NOT NULL,
            discoverable tinyint(1) NOT NULL DEFAULT 1,
            backup_eligible tinyint(1) NOT NULL DEFAULT 0,
            backup_state tinyint(1) NOT NULL DEFAULT 0,
            hardware_backed tinyint(1) NOT NULL DEFAULT 0,
            status varchar(24) NOT NULL DEFAULT \"active\",
            created_at datetime NOT NULL,
            last_used_at datetime DEFAULT NULL,
            revoked_at datetime DEFAULT NULL,
            updated_at datetime NOT NULL,
            PRIMARY KEY (id),
            UNIQUE KEY public_id (public_id),
            UNIQUE KEY credential_lookup_hash (credential_lookup_hash),
            KEY user_status (user_id,status),
            KEY revoked_at (revoked_at)
          ) ENGINE=InnoDB";
          if(!$db->query($sql)){fwrite(STDERR,$db->error."\n");exit(1);}
          if(!$db->query("ALTER TABLE diagnostic_passkeys CHANGE credential_lookup_hash credential_hash char(64) NOT NULL, CHANGE credential_id_ciphertext credential_cipher longtext NOT NULL")){fwrite(STDERR,$db->error."\n");exit(1);}
          echo "COLUMNS AFTER LEGACY CHANGE:\n";
          $r=$db->query("SHOW COLUMNS FROM diagnostic_passkeys"); while($row=$r->fetch_assoc()){echo $row["Field"]."\n";}
          echo "INDEXES AFTER LEGACY CHANGE:\n";
          $r=$db->query("SHOW INDEX FROM diagnostic_passkeys"); $found=false; while($row=$r->fetch_assoc()){echo $row["Key_name"]." => ".$row["Column_name"]." / non_unique=".$row["Non_unique"]."\n"; if($row["Key_name"]==="credential_lookup_hash" && $row["Column_name"]==="credential_hash" && (int)$row["Non_unique"]===0){$found=true;}}
          if(!$found){fwrite(STDERR,"Expected preserved stale index-name binding was not reproduced.\n");exit(1);}
          if(!$db->query("ALTER TABLE diagnostic_passkeys ADD COLUMN credential_lookup_hash char(64) NOT NULL")){fwrite(STDERR,$db->error."\n");exit(1);}
          $ok=$db->query("ALTER TABLE diagnostic_passkeys ADD UNIQUE KEY credential_lookup_hash (credential_lookup_hash)");
          if($ok){fwrite(STDERR,"Duplicate-name collision did not occur as expected.\n");exit(1);}
          echo "EXPECTED DUPLICATE-INDEX ERROR: ".$db->error."\n";
          if(stripos($db->error,"Duplicate key name")===false){exit(1);}
          echo "R335 MariaDB legacy index-name root cause PROVEN.\n";
          '
