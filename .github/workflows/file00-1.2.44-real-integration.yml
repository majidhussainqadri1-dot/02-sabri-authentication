name: File 02 Current File 00 1.2.44 Integration

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**
      - agent/**

permissions:
  contents: read

env:
  FILE00_REF: 738aa2ab4b8be3d6cfdb3ecd46c88aa8d9ece3a0
  FILE00_VERSION: '1.2.44'
  FILE00_LIVE_ROUTE_REF: c4ab298b3ba2b870d507d32b36b1b4afd2771621
  FILE00_LIVE_ROUTE_VERSION: '1.2.43'
  FILE02_VERSION: '1.3.4'
  FILE02_DB_VERSION: '1.3.0'
  FILE02_PASSKEY_SCHEMA: '1.0.1'

jobs:
  wordpress-mariadb-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout exact File 02 head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: file02
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout exact corrected File 00 candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          path: file00
          persist-credentials: false
          ref: ${{ env.FILE00_REF }}
      - name: Checkout exact live-route File 00 repository baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          path: file00-live-route
          persist-credentials: false
          ref: ${{ env.FILE00_LIVE_ROUTE_REF }}
      - name: Prove immutable paired inputs
        run: |
          set -euo pipefail
          test "$(git -C file02 rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git -C file00 rev-parse HEAD)" = "$FILE00_REF"
          test "$(git -C file00-live-route rev-parse HEAD)" = "$FILE00_LIVE_ROUTE_REF"
          grep -Fq "Version: ${FILE00_VERSION}" file00/source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "Version: ${FILE00_LIVE_ROUTE_VERSION}" file00-live-route/source/sabri-membership-core/sabri-membership-core.php
          grep -Fq '$allowed_types   = array_keys( smc_account_types() );' file00/source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          grep -Fq "Version: ${FILE02_VERSION}" file02/sabri-authentication.php
          grep -Fq "'patient'" file02/includes/class-sa-registration.php
          grep -Fq "'pharmacy'" file02/includes/class-sa-registration.php
          grep -Fq "'clinic'" file02/includes/class-sa-registration.php
          grep -Fq "'publisher'" file02/includes/class-sa-registration.php
      - name: Prove exact File 00 managed-page source contract
        run: |
          set -euo pipefail
          installer=file00-live-route/source/sabri-membership-core/includes/class-smc-installer.php
          functions=file00-live-route/source/sabri-membership-core/includes/functions.php
