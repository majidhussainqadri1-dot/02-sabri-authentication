name: R337 Activator Copy Fix

on:
  push:
    branches:
      - review/file02-r337-fresh-audit-2026-08-16

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r337-activator]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: review/file02-r337-fresh-audit-2026-08-16
      - name: Replace exact stale dependency copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/class-sa-activator.php')
          text = p.read_text()
          old = 'Membership Core 1.2.43 or later'
          new = 'Membership Core 1.2.44 or later'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale activator dependency string, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 02 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/r337-activator-copy-fix.yml
          git add includes/class-sa-activator.php
          git commit -m '[r337-activator] align activation dependency copy to File 00 1.2.44'
          git push origin HEAD:review/file02-r337-fresh-audit-2026-08-16
