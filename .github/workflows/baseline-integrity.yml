name: File 02 Release Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
      - baseline/**
      - audit/**
      - fix/**

permissions:
  contents: read

env:
  RELEASE_VERSION: '1.2.1'
  DB_VERSION: '1.2.0'
  BASELINE_COMMIT: 8ce0653b6f1de3beb6899642c4446653c40f0501
  BASELINE_LOCK_SHA256: 05f5573a59180619d1601b43f811234a9c727631628ca940960a983784892974

jobs:
  source-integrity:
    name: Exact-head source, contract and public-safety integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact immutable head and ancestry
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          git cat-file -e "${BASELINE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD
          test "$(git show "${BASELINE_COMMIT}:BASELINE-LOCK.json" | sha256sum | awk '{print $1}')" = "$BASELINE_LOCK_SHA256"

      - name: Verify release constitution and source policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          root = pathlib.Path('.')
          release = '1.2.1'
          db = '1.2.0'
          def fail(message):
              print('ERROR:', message, file=sys.stderr)
              raise SystemExit(1)
          files = sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts)
          forbidden_suffixes = ('.zip','.tar','.tgz','.gz','.7z','.rar','.env','.pem','.p12','.pfx','.key')
          forbidden = [p.as_posix() for p in files if p.name.lower().startswith('.env') or p.as_posix().lower().endswith(forbidden_suffixes)]
          if forbidden: fail('forbidden archive/credential files committed: ' + ', '.join(forbidden))
          patterns = {
              'private key': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'Google API key': rb'\bAIza[0-9A-Za-z_-]{35}\b',
              'GitHub token': rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',
              'AWS access key': rb'\bAKIA[0-9A-Z]{16}\b',
          }
          for path in files:
              data = path.read_bytes()
              for label, pattern in patterns.items():
                  if re.search(pattern, data): fail(f'possible {label} in {path}')
          main = (root/'sabri-authentication.php').read_text()
          readme = (root/'readme.txt').read_text()
          if f'Version: {release}' not in main or f"define( 'SAUTH_VERSION', '{release}' );" not in main: fail('release version mismatch')
          if f"define( 'SAUTH_DB_VERSION', '{db}' );" not in main: fail('DB version mismatch')
          if "define( 'SAUTH_PASSKEY_CONTRACT_VERSION', '1.0.0' );" not in main: fail('passkey contract missing')
          if f'Stable tag: {release}' not in readme: fail('readme stable tag mismatch')
          storage_require = "require_once SAUTH_DIR . 'includes/class-sauth-storage-router.php';"
          if storage_require not in main or main.index(storage_require) > main.index('function sauth_start_plugin()'): fail('storage-router bootstrap binding invalid')
          lock = json.loads((root/'RELEASE-LOCK.json').read_text())
          expected = {
              'release_version': release,
              'database_version': db,
              'passkey_schema_version': '1.0.0',
              'intended_canonical_repository': '02-sabri-authentication-and-accounts',
              'transport_repository': '02-sabri-authentication',
              'package_folder': '02-sabri-authentication',
              'php_prefix': 'SAUTH_',
              'canonical_sessions_route': '/account/sessions/',
              'minimum_account_contract_version': '1.1.0',
              'passkey_assurance_contract_version': '1.0.0',
              'passkey_assurance_owner': 'file02',
          }
          for key, value in expected.items():
              if lock.get(key) != value: fail('RELEASE-LOCK mismatch for ' + key)
          required = {
              'README.md','STATUS.md','PLAN-TRACEABILITY.md','RELEASE-MANIFEST.md','RELEASE-LOCK.json','SBOM.spdx.json',
              'sabri-authentication.php','uninstall.php','readme.txt','tools/build-package.sh',
              'includes/class-sauth-storage-router.php','includes/class-sauth-passkeys.php','includes/class-sauth-passkey-runtime.php',
              'tests/security-unit.php','tests/storage-migration-unit.php','tests/r291-r300-review-regression.php','tests/r299-cross-flow-regression.php',
              'tests/r302-migration-postcondition-regression.php','tests/r303-registration-recovery-regression.php','tests/r304-google-auth-regression.php',
              'tests/r305-passkey-lifecycle-regression.php','tests/r306-session-assurance-regression.php','tests/r307-privacy-operations-regression.php',
              'tests/r308-route-ui-regression.php','tests/r309-release-truth-regression.php'
          }
          present = {p.as_posix() for p in files}
          missing = sorted(required-present)
          if missing: fail('missing release evidence: ' + ', '.join(missing))
          trace = (root/'PLAN-TRACEABILITY.md').read_text()
          for req in [f'F02-FR-{n:03d}' for n in range(1,13)] + [f'F02-NFR-{n:03d}' for n in range(1,11)]:
              if req not in trace: fail('missing traceability: ' + req)
          subprocess.run([sys.executable,'tests/architecture-check.py'],check=True)
          print('Release constitution and source policy PASS.')
          PY

      - name: Validate JavaScript and CSS
        run: |
          set -euo pipefail
          node --check assets/js/authentication.js
          python3 - <<'PY'
          import pathlib
          css=pathlib.Path('assets/css/authentication.css').read_text()
          if css.count('{') != css.count('}'): raise SystemExit('CSS brace mismatch')
          if 'orange' in css.lower() or '#f97316' in css.lower(): raise SystemExit('superseded orange-primary token found')
          js=pathlib.Path('assets/js/authentication.js').read_text()
          if 'attestation_object' not in js or 'getPublicKey(' in js: raise SystemExit('WebAuthn trust boundary regression')
          PY

  php-runtime:
    name: PHP ${{ matrix.php }} lint and cumulative no-network regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          extensions: openssl
      - name: Lint and run cumulative suites
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find . -type f -name '*.php' -not -path './.git/*' -print | sort)
          test "${#php_files[@]}" -ge 40
          for file in "${php_files[@]}"; do php -l "$file"; done
          tests=(
            tests/security-unit.php
            tests/cf01-assurance-unit.php
            tests/professional-reauthentication-unit.php
            tests/plan-harmonization-unit.php
            tests/registration-authentication-unit.php
            tests/complete-plan-unit.php
            tests/passkey-webauthn-unit.php
            tests/three-plan-completion-unit.php
            tests/storage-migration-unit.php
            tests/r291-r300-review-regression.php
            tests/r299-cross-flow-regression.php
            tests/r302-migration-postcondition-regression.php
            tests/r303-registration-recovery-regression.php
            tests/r304-google-auth-regression.php
            tests/r305-passkey-lifecycle-regression.php
            tests/r306-session-assurance-regression.php
            tests/r307-privacy-operations-regression.php
            tests/r308-route-ui-regression.php
            tests/r309-release-truth-regression.php
          )
          for test_file in "${tests[@]}"; do php "$test_file"; done

  deterministic-package:
    name: Deterministic package and clean-extract parity
    needs: [source-integrity, php-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: openssl
      - name: Build twice, compare and verify clean extraction
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1785984000
          bash tools/build-package.sh "$RUNNER_TEMP/a"
          bash tools/build-package.sh "$RUNNER_TEMP/b"
          a="$RUNNER_TEMP/a/02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip"
          b="$RUNNER_TEMP/b/02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip"
          ma="$RUNNER_TEMP/a/02-sabri-authentication-${RELEASE_VERSION}-MANIFEST.json"
          mb="$RUNNER_TEMP/b/02-sabri-authentication-${RELEASE_VERSION}-MANIFEST.json"
          cmp --silent "$a" "$b"
          cmp --silent "$ma" "$mb"
          unzip -t "$a"
          unzip -q "$a" -d "$RUNNER_TEMP/extract"
          test "$(find "$RUNNER_TEMP/extract" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/extract/02-sabri-authentication/includes/class-sauth-storage-router.php"
          test -f "$RUNNER_TEMP/extract/02-sabri-authentication/includes/class-sauth-passkeys.php"
          while IFS= read -r file; do php -l "$file"; done < <(find "$RUNNER_TEMP/extract/02-sabri-authentication" -type f -name '*.php' -print | sort)
          cp "$a" "02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip"
          cp "$ma" "02-sabri-authentication-${RELEASE_VERSION}-MANIFEST.json"
          sha256sum "02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip" | tee CHECKSUMS.sha256
      - name: Retain exact-head candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file02-${{ env.RELEASE_VERSION }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            02-sabri-authentication-${{ env.RELEASE_VERSION }}-SOURCE-CANDIDATE.zip
            02-sabri-authentication-${{ env.RELEASE_VERSION }}-MANIFEST.json
            CHECKSUMS.sha256
            SBOM.spdx.json
