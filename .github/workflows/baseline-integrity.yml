name: File 02 Release Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
      - baseline/**
      - audit/**
      - fix/**

permissions:
  contents: read

env:
  RELEASE_VERSION: '1.2.6'
  DB_VERSION: '1.2.1'
  PASSKEY_SCHEMA_VERSION: '1.0.1'
  BASELINE_COMMIT: 8ce0653b6f1de3beb6899642c4446653c40f0501
  BASELINE_LOCK_SHA256: 05f5573a59180619d1601b43f811234a9c727631628ca940960a983784892974

jobs:
  source-integrity:
    name: Exact-head source and release constitution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove immutable head and baseline ancestry
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          git cat-file -e "${BASELINE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD
          test "$(git show "${BASELINE_COMMIT}:BASELINE-LOCK.json" | sha256sum | awk '{print $1}')" = "$BASELINE_LOCK_SHA256"
      - name: Verify release identity and source policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys
          root=pathlib.Path('.')
          main=(root/'sabri-authentication.php').read_text()
          readme=(root/'readme.txt').read_text()
          lock=json.loads((root/'RELEASE-LOCK.json').read_text())
          def req(ok,msg):
              if not ok: print('ERROR:',msg,file=sys.stderr); raise SystemExit(1)
          req('Version: 1.2.6' in main and "SAUTH_VERSION', '1.2.6" in main,'runtime release identity mismatch')
          req("SAUTH_DB_VERSION', '1.2.1" in main,'DB release identity mismatch')
          req('Stable tag: 1.2.6' in readme,'readme stable tag mismatch')
          req(lock.get('release_version')=='1.2.6','release lock runtime mismatch')
          req(lock.get('database_version')=='1.2.1','release lock DB mismatch')
          req(lock.get('passkey_schema_version')=='1.0.1','release lock passkey schema mismatch')
          required=['README.md','STATUS.md','PLAN-TRACEABILITY.md','RELEASE-MANIFEST.md','RELEASE-LOCK.json','SBOM.spdx.json','tests/r320-final-release-regression.php','tests/r329-release-truth-regression.php','tests/r330-final-adversarial-regression.php']
          for f in required: req((root/f).is_file(),'missing release evidence: '+f)
          forbidden=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              low=p.as_posix().lower()
              if p.name.lower().startswith('.env') or low.endswith(('.zip','.tar','.tgz','.7z','.rar','.pem','.p12','.pfx','.key')): forbidden.append(p.as_posix())
              b=p.read_bytes()
              if re.search(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',b): forbidden.append(p.as_posix()+':private-key')
          req(not forbidden,'forbidden archive/credential source: '+', '.join(forbidden))
          req(not list((root/'.github/workflows').glob('*correction*.yml')),'temporary correction workflow remains')
          req(not (root/'.github/workflows/round-ledger-apply.yml').exists(),'temporary round ledger workflow remains')
          req(not (root/'tools/apply-round-ledger.py').exists(),'temporary round ledger applicator remains')
          req(not (root/'.github/forty-round-payload').exists(),'historical corrective payload remains')
          print('Release constitution and source policy PASS.')
          PY
      - name: Validate architecture JavaScript and CSS
        run: |
          set -euo pipefail
          python3 tests/architecture-check.py
          node --check assets/js/authentication.js
          python3 - <<'PY'
          import pathlib
          css=pathlib.Path('assets/css/authentication.css').read_text()
          if css.count('{') != css.count('}'): raise SystemExit('CSS brace mismatch')
          if 'orange' in css.lower() or '#f97316' in css.lower(): raise SystemExit('superseded orange-primary token found')
          PY

  php-runtime:
    name: PHP ${{ matrix.php }} lint and cumulative regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          extensions: openssl
      - name: Lint and run all permanent source suites
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find . -type f -name '*.php' -not -path './.git/*' -print | sort)
          test "${#php_files[@]}" -ge 40
          for file in "${php_files[@]}"; do php -l "$file" >/dev/null; done
          tests=(
            tests/security-unit.php
            tests/cf01-assurance-unit.php
            tests/professional-reauthentication-unit.php
            tests/plan-harmonization-unit.php
            tests/registration-authentication-unit.php
            tests/complete-plan-unit.php
            tests/passkey-webauthn-unit.php
            tests/three-plan-completion-unit.php
            tests/storage-migration-unit.php
            tests/r291-r300-review-regression.php
            tests/r299-cross-flow-regression.php
            tests/r302-migration-postcondition-regression.php
            tests/r303-registration-recovery-regression.php
            tests/r304-google-auth-regression.php
            tests/r305-passkey-lifecycle-regression.php
            tests/r306-session-assurance-regression.php
            tests/r307-privacy-operations-regression.php
            tests/r308-route-ui-regression.php
            tests/r309-release-truth-regression.php
            tests/r310-final-adversarial-regression.php
          )
          for extra in tests/r31*-regression.php tests/r32*-regression.php tests/r33*-regression.php; do [ -e "$extra" ] && tests+=("$extra"); done
          declare -A seen=()
          for test_file in "${tests[@]}"; do
            if [ -z "${seen[$test_file]+x}" ]; then php "$test_file"; seen[$test_file]=1; fi
          done

  deterministic-package:
    name: Deterministic package and clean-extract parity
    needs: [source-integrity, php-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: openssl
      - name: Build twice and prove deterministic parity
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1785984000
          bash tools/build-package.sh "$RUNNER_TEMP/a"
          bash tools/build-package.sh "$RUNNER_TEMP/b"
          a="$RUNNER_TEMP/a/02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip"
          b="$RUNNER_TEMP/b/02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip"
          ma="$RUNNER_TEMP/a/02-sabri-authentication-${RELEASE_VERSION}-MANIFEST.json"
          mb="$RUNNER_TEMP/b/02-sabri-authentication-${RELEASE_VERSION}-MANIFEST.json"
          cmp --silent "$a" "$b"
          cmp --silent "$ma" "$mb"
          unzip -t "$a"
          unzip -q "$a" -d "$RUNNER_TEMP/extract"
          while IFS= read -r file; do php -l "$file" >/dev/null; done < <(find "$RUNNER_TEMP/extract/02-sabri-authentication" -type f -name '*.php' -print | sort)
          cp "$a" "02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip"
          cp "$ma" "02-sabri-authentication-${RELEASE_VERSION}-MANIFEST.json"
          sha256sum "02-sabri-authentication-${RELEASE_VERSION}-SOURCE-CANDIDATE.zip" | tee CHECKSUMS.sha256
      - name: Retain exact-head candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file02-${{ env.RELEASE_VERSION }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            02-sabri-authentication-${{ env.RELEASE_VERSION }}-SOURCE-CANDIDATE.zip
            02-sabri-authentication-${{ env.RELEASE_VERSION }}-MANIFEST.json
            CHECKSUMS.sha256
            SBOM.spdx.json
