name: File 02 Contract Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
      - baseline/**
      - audit/**

permissions:
  contents: read

jobs:
  contract-integrity:
    name: 1.0.0 source, architecture and public-safety integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify ancestry, historical evidence and source policy
        env:
          BASELINE_COMMIT: 8ce0653b6f1de3beb6899642c4446653c40f0501
          BASELINE_LOCK_SHA256: 05f5573a59180619d1601b43f811234a9c727631628ca940960a983784892974
          HISTORICAL_RELEASE_LOCK_SHA256: 41885e692cb179fc3e2dc98d4d15d9cf254eefadec0b853321ca3c96c324ea03
        run: |
          set -euo pipefail
          git diff --check
          git cat-file -e "${BASELINE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD
          test "$(git show "${BASELINE_COMMIT}:BASELINE-LOCK.json" | sha256sum | awk '{print $1}')" = "$BASELINE_LOCK_SHA256"
          test "$(sha256sum RELEASE-LOCK.json | awk '{print $1}')" = "$HISTORICAL_RELEASE_LOCK_SHA256"

          if test -f .gitmodules; then
            echo 'Git submodules are prohibited in File 02.' >&2
            exit 1
          fi
          if git ls-files -s | awk '$1 == "120000" { found=1 } END { exit !found }'; then
            echo 'Symbolic links are prohibited in File 02.' >&2
            exit 1
          fi
          if grep -RIl --exclude-dir=.git '^version https://git-lfs.github.com/spec/v1$' . | grep -q .; then
            echo 'Git LFS pointer files are prohibited in File 02.' >&2
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import subprocess
          import sys

          root = pathlib.Path('.')

          def fail(message):
              print(f'ERROR: {message}', file=sys.stderr)
              raise SystemExit(1)

          all_files = sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts)
          forbidden_suffixes = ('.zip', '.tar', '.tgz', '.gz', '.7z', '.rar', '.env', '.pem', '.p12', '.pfx', '.key')
          forbidden = [p.as_posix() for p in all_files if p.name.lower().startswith('.env') or p.as_posix().lower().endswith(forbidden_suffixes)]
          if forbidden:
              fail('forbidden archive/credential files committed: ' + ', '.join(forbidden))

          secret_patterns = {
              'private key': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'Google API key': rb'\bAIza[0-9A-Za-z_-]{35}\b',
              'GitHub token': rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',
              'AWS access key': rb'\bAKIA[0-9A-Z]{16}\b',
              'Slack token': rb'\bxox[baprs]-[0-9A-Za-z-]{20,}\b',
              'JWT-like token': rb'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b',
              'credential URL': rb'(?i)\b[a-z][a-z0-9+.-]*://[^\s/:]+:[^\s/@]+@',
          }
          for path in all_files:
              data = path.read_bytes()
              for label, pattern in secret_patterns.items():
                  if re.search(pattern, data):
                      fail(f'possible {label} found in {path.as_posix()}')

          main = (root / 'sabri-authentication.php').read_text(encoding='utf-8')
          readme = (root / 'readme.txt').read_text(encoding='utf-8')
          if 'Version: 1.0.0' not in main or "define( 'SA_VERSION', '1.0.0' );" not in main:
              fail('plugin header or SA_VERSION is not 1.0.0')
          if "define( 'SA_DB_VERSION', '1.0.0' );" not in main:
              fail('SA_DB_VERSION is not 1.0.0')
          if 'Stable tag: 1.0.0' not in readme:
              fail('readme stable tag is not 1.0.0')

          required = {
              'PLAN-TRACEABILITY.md',
              'readme.txt',
              'uninstall.php',
              'tools/build-package.sh',
              'includes/class-sauth-account-contract.php',
              'includes/class-sauth-completion-resolver.php',
              'includes/class-sauth-event-outbox.php',
              'includes/class-sauth-email-verification.php',
              'includes/class-sauth-login-risk.php',
              'includes/class-sauth-provider-health.php',
              'includes/class-sauth-provider-http-guard.php',
              'includes/class-sauth-session-manager.php',
              'includes/class-sauth-operations.php',
              'includes/class-sa-authentication-assurance.php',
              'includes/class-sa-professional-reauthentication.php',
              'templates/login.php',
              'templates/signup.php',
              'templates/reset-password.php',
              'tests/complete-plan-unit.php',
              'tests/registration-authentication-unit.php',
              'tests/plan-harmonization-unit.php',
              'tests/cf01-assurance-unit.php',
              'tests/professional-reauthentication-unit.php',
              'tests/architecture-check.py',
              'tests/security-unit.php',
          }
          present = {p.as_posix() for p in all_files}
          missing = sorted(required - present)
          if missing:
              fail('missing 1.0.0 evidence: ' + ', '.join(missing))

          trace = (root / 'PLAN-TRACEABILITY.md').read_text(encoding='utf-8')
          for requirement in [f'F02-FR-{n:03d}' for n in range(1, 13)]:
              if requirement not in trace:
                  fail(f'missing functional traceability: {requirement}')
          for requirement in [f'F02-NFR-{n:03d}' for n in range(1, 11)]:
              if requirement not in trace:
                  fail(f'missing non-functional traceability: {requirement}')

          source_paths = sorted(
              p for p in all_files
              if p.suffix.lower() in {'.php', '.css', '.js', '.txt'}
              and not p.as_posix().startswith('tests/')
          )
          canonical = []
          for path in source_paths:
              data = path.read_bytes()
              canonical.append(f"{hashlib.sha256(data).hexdigest()}  {len(data)}  {path.as_posix()}")
          tree_text = '\n'.join(canonical) + '\n'
          print('File 02 1.0.0 dynamic source-tree SHA-256:', hashlib.sha256(tree_text.encode()).hexdigest())
          print('Source files:', len(source_paths))
          print('Source bytes:', sum(p.stat().st_size for p in source_paths))
          subprocess.run([sys.executable, 'tests/architecture-check.py'], check=True)
          PY

  php-lint-and-runtime:
    name: PHP ${{ matrix.php }} lint and runtime suites
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.3'
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint every PHP file and run no-network suites
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find . -type f -name '*.php' -not -path './.git/*' -print | sort)
          test "${#php_files[@]}" -ge 36
          for file in "${php_files[@]}"; do
            php -l "$file"
          done
          php tests/security-unit.php
          php tests/cf01-assurance-unit.php
          php tests/professional-reauthentication-unit.php
          php tests/plan-harmonization-unit.php
          php tests/registration-authentication-unit.php
          php tests/complete-plan-unit.php

  deterministic-package:
    name: Deterministic package and clean-extract parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Build twice, compare and lint clean extraction
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1767225600
          bash tools/build-package.sh "$RUNNER_TEMP/build-a"
          bash tools/build-package.sh "$RUNNER_TEMP/build-b"

          archive_a="$RUNNER_TEMP/build-a/02-sabri-authentication-1.0.0-SOURCE-CANDIDATE.zip"
          archive_b="$RUNNER_TEMP/build-b/02-sabri-authentication-1.0.0-SOURCE-CANDIDATE.zip"
          test -f "$archive_a" && test -f "$archive_b"
          test "$(sha256sum "$archive_a" | awk '{print $1}')" = "$(sha256sum "$archive_b" | awk '{print $1}')"
          test "$(sha256sum "$RUNNER_TEMP/build-a/02-sabri-authentication-1.0.0-MANIFEST.json" | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/build-b/02-sabri-authentication-1.0.0-MANIFEST.json" | awk '{print $1}')"

          unzip -q "$archive_a" -d "$RUNNER_TEMP/extract"
          test -f "$RUNNER_TEMP/extract/02-sabri-authentication/sabri-authentication.php"
          test -f "$RUNNER_TEMP/extract/02-sabri-authentication/PACKAGE-MANIFEST.json"
          test "$(find "$RUNNER_TEMP/extract" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          while IFS= read -r file; do php -l "$file"; done < <(find "$RUNNER_TEMP/extract" -type f -name '*.php' | sort)
          ! find "$RUNNER_TEMP/extract" -type f \( -name '*.zip' -o -name '*.pem' -o -name '*.key' -o -name '.env*' \) | grep -q .
          unzip -Z1 "$archive_a" | awk '/^\// || /(^|\/)\.\.($|\/)/ || /\\/ { bad=1 } END { exit bad ? 0 : 1 }' && { echo 'Unsafe archive path found.' >&2; exit 1; } || true
          cat "$RUNNER_TEMP/build-a/CHECKSUMS.sha256"
