name: File 02 Real File 00 1.2.43 Integration

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**

permissions:
  contents: read

env:
  FILE00_REF: a71dc91b8ce80774adac35a90d7517999054f120
  FILE02_VERSION: '1.2.1'

jobs:
  wordpress-mariadb-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact File 02 candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact File 02 head
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          grep -Fq "Version: ${FILE02_VERSION}" sabri-authentication.php
          grep -Fq "require_once SAUTH_DIR . 'includes/class-sauth-storage-router.php';" sabri-authentication.php

      - name: Checkout exact File 00 correction candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          ref: ${{ env.FILE00_REF }}
          path: file00-exact
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact File 00 head
        run: |
          set -euo pipefail
          test "$(git -C file00-exact rev-parse HEAD)" = "$FILE00_REF"
          grep -Fq "Version: 1.2.43" file00-exact/source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "SMC_AUTHENTICATION_CONTRACT_V11_VERSION" file00-exact/source/sabri-membership-core/sabri-membership-core.php

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: mysqli, openssl, mbstring, json

      - name: Install WordPress 7.0.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.0.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY_ID 'file02-integration-key-v1' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://file02-integration.local --title='File 02 Integration CI' --admin_user=founder --admin_password='File02-Integration-Password!9' --admin_email=founder@example.test --skip-email

      - name: Activate exact File 00 and migrate
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress/wp-content/plugins/sabri-membership-core
          cp -R file00-exact/source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          php /tmp/wp-cli.phar plugin activate sabri-membership-core --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval '
            $key=SMC_Security::ensure_key_ready(); if(is_wp_error($key)){fwrite(STDERR,$key->get_error_message()."\n");exit(40);}
            $audit=SMC_Installer::ensure_audit_infrastructure(); if(is_wp_error($audit)){fwrite(STDERR,$audit->get_error_message()."\n");exit(41);}
            SMC_Schema_Compat::reconcile_verification_queue_index(); SMC_Installer::maybe_upgrade();
            if("1.2.43"!==(string)SMC_VERSION){fwrite(STDERR,"unexpected File00 version\n");exit(42);}
            if("1.4.5"!==(string)get_option("smc_db_version","")){fwrite(STDERR,"File00 migration incomplete\n");exit(43);}
            if(!defined("SMC_AUTHENTICATION_CONTRACT_V11_VERSION") || version_compare(SMC_AUTHENTICATION_CONTRACT_V11_VERSION,"1.1.0","<")){fwrite(STDERR,"File00 account provider unavailable\n");exit(44);}
            echo "PASS File00 1.2.43 / DB 1.4.5 / account-contract ".SMC_AUTHENTICATION_CONTRACT_V11_VERSION."\n";
          ' --path=/tmp/wordpress

      - name: Install and activate exact File 02 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress/wp-content/plugins/02-sabri-authentication
          mkdir -p /tmp/wordpress/wp-content/plugins/02-sabri-authentication
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='file00-exact' --exclude='tests' ./ /tmp/wordpress/wp-content/plugins/02-sabri-authentication/
          php /tmp/wp-cli.phar plugin activate 02-sabri-authentication --path=/tmp/wordpress

      - name: Prove clean second request and provider compatibility
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval '
            if(!is_plugin_active("02-sabri-authentication/sabri-authentication.php")){fwrite(STDERR,"File02 did not remain active\n");exit(50);}
            if("1.2.1"!==(string)SAUTH_VERSION){fwrite(STDERR,"unexpected File02 version\n");exit(51);}
            if(!class_exists("SAUTH_Storage_Router")){fwrite(STDERR,"storage router class unavailable after bootstrap\n");exit(52);}
            if(!class_exists("SAUTH_Account_Contract") || !SAUTH_Account_Contract::provider_available()){fwrite(STDERR,"File02 rejects File00 account provider\n");exit(53);}
            if(!class_exists("SAUTH_Authentication_Assurance")){fwrite(STDERR,"authentication assurance unavailable\n");exit(54);}
            echo "PASS File02 1.2.1 clean second request against File00 ".SMC_VERSION."\n";
          ' --path=/tmp/wordpress

      - name: Prove third independent WordPress load
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar option get siteurl --path=/tmp/wordpress >/dev/null
          php /tmp/wp-cli.phar plugin status 02-sabri-authentication --path=/tmp/wordpress | grep -Fq 'Status: Active'
          echo 'PASS independent WordPress reload with File 02 active.'
