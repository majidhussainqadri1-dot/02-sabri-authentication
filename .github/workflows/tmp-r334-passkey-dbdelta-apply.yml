name: Temporary File 02 R334 Passkey dbDelta Apply

on:
  push:
    branches:
      - fix/file02-passkey-dbdelta-migration-1.2.5

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply only frozen R334 correction
        run: |
          set -euo pipefail
          python3 tools/apply-r334-passkey-dbdelta.py
          git diff --check
      - name: Full cumulative source verification before commit
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find . -type f -name '*.php' -not -path './.git/*' -print | sort)
          test "${#php_files[@]}" -ge 40
          for file in "${php_files[@]}"; do php -l "$file" >/dev/null; done
          tests=(
            tests/security-unit.php
            tests/cf01-assurance-unit.php
            tests/professional-reauthentication-unit.php
            tests/plan-harmonization-unit.php
            tests/registration-authentication-unit.php
            tests/complete-plan-unit.php
            tests/passkey-webauthn-unit.php
            tests/three-plan-completion-unit.php
            tests/storage-migration-unit.php
            tests/r291-r300-review-regression.php
            tests/r299-cross-flow-regression.php
          )
          for extra in tests/r30*-regression.php tests/r31*-regression.php tests/r32*-regression.php tests/r33*-regression.php; do [ -e "$extra" ] && tests+=("$extra"); done
          declare -A seen=()
          for test_file in "${tests[@]}"; do
            if [ -z "${seen[$test_file]+x}" ]; then php "$test_file"; seen[$test_file]=1; fi
          done
          node --check assets/js/authentication.js
          git diff --check
      - name: Record R334 correction evidence
        run: |
          set -euo pipefail
          cat > review-evidence/R334-completion.md <<'EOF'
          # R334 — Passkey dbDelta Migration Correction and Retest Evidence

          R334 was frozen before product correction in `review-evidence/R334-REVIEW-FROZEN.md`.

          The corrected source puts every passkey index definition on its own CREATE TABLE line for WordPress dbDelta compatibility. Runtime identity advances to 1.2.5 while DB remains 1.2.1, passkey schema remains 1.0.1 and passkey assurance contract remains 1.0.0.

          Complete PHP lint and the cumulative no-network source regression set, including the permanent R334 passkey-dbDelta regression, passed before this correction commit was created.

          The cross-file File 00 1.2.44 release blocker remains open until the complete exact WordPress/MariaDB integration chain passes on the corrected 1.2.5 source candidate.

          Exact deployed code ابھی unverified ہے؛ repository-based diagnosis provisional ہے۔
          EOF
          sed -i 's/^          //' review-evidence/R334-completion.md
          git diff --check
      - name: Commit exact tested corrected tree
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git commit -m 'R334: fix passkey dbDelta migration and advance File 02 to 1.2.5'
          git push origin HEAD:fix/file02-passkey-dbdelta-migration-1.2.5
