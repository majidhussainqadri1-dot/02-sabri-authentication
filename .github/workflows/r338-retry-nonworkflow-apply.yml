name: R338 Retry Nonworkflow Apply

on:
  push:
    branches:
      - review/file02-r338-fresh-review-fix-2026-08-16

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r338-apply]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: review/file02-r338-fresh-review-fix-2026-08-16
      - name: Extract and run already-reviewed R338 correction program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/r338-apply-frozen-ledger.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=="python3 - <<'PY'")
          end=next(i for i in range(start+1,len(src)) if src[i].strip()=='PY')
          Path('/tmp/r338-apply.py').write_text(textwrap.dedent('\n'.join(src[start+1:end]))+'\n',encoding='utf-8')
          PY
          python3 /tmp/r338-apply.py
          # GitHub Actions token on this repository may not rewrite workflow files.
          # Release packaging is already fail-closed in tools/build-package.sh, so
          # restore workflow YAML and commit only source/docs/tests/release locks.
          git checkout -- .github/workflows/baseline-integrity.yml
          git diff --check
          php -l tests/r338-source-lineage-release-regression.php
          python3 -m json.tool SOURCE-LINEAGE-LOCK.json >/dev/null
          python3 -m json.tool RELEASE-LOCK.json >/dev/null
          python3 -m json.tool SBOM.spdx.json >/dev/null
      - name: Commit non-workflow R338 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 02 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git commit -m '[r338-apply] apply frozen-ledger source, release-truth and containment corrections'
          git push origin HEAD:review/file02-r338-fresh-review-fix-2026-08-16
