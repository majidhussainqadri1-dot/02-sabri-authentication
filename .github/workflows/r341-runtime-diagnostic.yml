name: R341 Exact Pair Runtime Diagnostic

on:
  pull_request:
  push:
    branches:
      - fix/file02-legacy-email-verification-reconciliation-1.3.4

permissions:
  contents: read

env:
  FILE00_REF: 738aa2ab4b8be3d6cfdb3ecd46c88aa8d9ece3a0

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout exact File 02 head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: file02
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout exact File 00 main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          path: file00
          persist-credentials: false
          ref: ${{ env.FILE00_REF }}
      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: mysqli,openssl
      - name: Install WordPress and exact plugins
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          mkdir -p /tmp/wordpress
          /tmp/wp core download --version=7.0 --path=/tmp/wordpress --quiet
          /tmp/wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --path=/tmp/wordpress --skip-check --quiet
          /tmp/wp config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          /tmp/wp config set SMC_MASTER_KEY 'file00-file02-diagnostic-master-key-2026' --type=constant --path=/tmp/wordpress
          /tmp/wp config set SMC_MASTER_KEY_ID 'file02-diagnostic-key-v1' --type=constant --path=/tmp/wordpress
          /tmp/wp config set SA_MASTER_KEY 'file02-diagnostic-dedicated-master-key-2026' --type=constant --path=/tmp/wordpress
          /tmp/wp core install --url=http://example.test --title='R341 Diagnostic' --admin_user=admin --admin_password='Diagnostic-Only-Password-2026!' --admin_email=admin@example.test --skip-email --path=/tmp/wordpress --quiet
          cp -R file00/source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          mkdir -p /tmp/wordpress/wp-content/plugins/sabri-authentication
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='tools' --exclude='review-evidence' file02/ /tmp/wordpress/wp-content/plugins/sabri-authentication/
          /tmp/wp plugin activate sabri-membership-core --path=/tmp/wordpress
          /tmp/wp eval 'wp_set_current_user(1); do_action("admin_init"); if((string)get_option("smc_db_version","")!==SMC_DB_VERSION||SMC_Completion::safe_mode()){exit(1);}' --path=/tmp/wordpress
          /tmp/wp plugin activate sabri-authentication --path=/tmp/wordpress
      - name: Prove application-row boundary and retry through canonical File 00 path
        run: |
          set -euo pipefail
          /tmp/wp eval '
          global $wpdb;
          $uid=1; $u=get_userdata($uid); $email=strtolower(trim((string)$u->user_email)); $now=current_time("mysql",true);
          $file02=SAUTH_Activator::table("email_verifications"); $email_hash=hash_hmac("sha256",$email,wp_salt("secure_auth")); $zero=str_repeat("0",64);
          $target=SMC_Security::blind_index($email,"contact-target"); $lookup=SMC_Security::blind_index("historical-file02-token","contact-code"); $code_hash=wp_hash_password("historical-file02-token"); $t=$wpdb->prefix."smc_contact_otps";
          $seed_local=function()use($wpdb,$file02,$uid,$email_hash,$zero,$now){return $wpdb->query($wpdb->prepare("INSERT INTO {$file02} (user_id,email_hash,token_hash,status,attempts,sent_at,expires_at,verified_at,created_at,updated_at) VALUES (%d,%s,%s,\"verified\",1,%s,%s,%s,%s,%s) ON DUPLICATE KEY UPDATE email_hash=VALUES(email_hash),token_hash=VALUES(token_hash),status=VALUES(status),attempts=VALUES(attempts),sent_at=VALUES(sent_at),expires_at=VALUES(expires_at),verified_at=VALUES(verified_at),updated_at=VALUES(updated_at)",$uid,$email_hash,$zero,$now,$now,$now,$now,$now));};
          $seed_receipt=function()use($wpdb,$t,$uid,$target,$lookup,$code_hash,$now){return $wpdb->query($wpdb->prepare("INSERT INTO {$t} (user_id,channel,target_hash,code_lookup_hash,code_hash,attempts,expires_at,verified_at,created_at,delivery_receipt_hash,delivered_at) VALUES (%d,\"email\",%s,%s,%s,0,%s,%s,%s,NULL,NULL) ON DUPLICATE KEY UPDATE target_hash=VALUES(target_hash),code_lookup_hash=VALUES(code_lookup_hash),code_hash=VALUES(code_hash),attempts=0,expires_at=VALUES(expires_at),verified_at=VALUES(verified_at),delivery_receipt_hash=NULL,delivered_at=NULL",$uid,$target,$lookup,$code_hash,$now,$now,$now));};
          $state=array("contract"=>"sauth.account-orchestration","contract_version"=>"1.1.0","provider_contract"=>"smc.authentication-account","provider_version"=>"1.1.0","result"=>"allow","reason_code"=>"completion_required","missing_steps"=>array("email"),"next_route"=>home_url("/verify-email/"));
          $seed_local(); $seed_receipt();
          $before=array("application_exists"=>(bool)smc_application($uid),"contact_verified"=>SMC_Contracts::contact_verified($uid,"email"));
          $first=SAUTH_Email_Verification_Reconciler::reconcile_if_needed($uid,$state);
          $first_row=$wpdb->get_row($wpdb->prepare("SELECT verified_at,delivery_receipt_hash,delivered_at FROM {$t} WHERE user_id=%d AND channel=\"email\" LIMIT 1",$uid),ARRAY_A);
          $without_app=array("contact_verified"=>SMC_Contracts::contact_verified($uid,"email"),"email_still_missing"=>in_array("email",(array)($first["missing_steps"]??array()),true),"receipt_complete"=>is_array($first_row)&&!empty($first_row["verified_at"])&&!empty($first_row["delivery_receipt_hash"])&&!empty($first_row["delivered_at"]));
          if(!smc_application($uid)){SMC_Contracts::register_account($uid);}
          $application_after=(bool)smc_application($uid);
          $seed_local(); $seed_receipt();
          $second=SAUTH_Email_Verification_Reconciler::reconcile_if_needed($uid,$state);
          $second_row=$wpdb->get_row($wpdb->prepare("SELECT verified_at,delivery_receipt_hash,delivered_at FROM {$t} WHERE user_id=%d AND channel=\"email\" LIMIT 1",$uid),ARRAY_A);
          $with_app=array("application_exists"=>$application_after,"contact_verified"=>SMC_Contracts::contact_verified($uid,"email"),"email_still_missing"=>in_array("email",(array)($second["missing_steps"]??array()),true),"receipt_complete"=>is_array($second_row)&&!empty($second_row["verified_at"])&&!empty($second_row["delivery_receipt_hash"])&&!empty($second_row["delivered_at"]),"wpdb_error"=>sanitize_text_field((string)$wpdb->last_error));
          echo wp_json_encode(array("before"=>$before,"without_application"=>$without_app,"after_canonical_register_account"=>$with_app),JSON_PRETTY_PRINT)."\n";
          if($before["application_exists"]||!$without_app["receipt_complete"]||$without_app["contact_verified"]||!$with_app["application_exists"]||!$with_app["contact_verified"]||$with_app["email_still_missing"]||!$with_app["receipt_complete"]){exit(1);} 
          ' --path=/tmp/wordpress
